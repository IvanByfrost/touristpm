<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TouristChain | Viajes Exóticos</title>

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">

  <!-- Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>

  <!-- Tema compiled from SCSS (moved to static/css) -->
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    /* Estilos críticos para funcionalidad SPA */
    .view { display: none !important; opacity: 0; }
    .view.active { display: block !important; opacity: 1; }
  </style>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/avion.png" />
  
  <!-- Main Entry Point (Native ESM) -->
  <script type="module" src="/js/main.js"></script>
</head>
<body class="font-outfit">
  <!-- Header -->
  <nav class="navbar is-transparent tc-header-nav" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item" href="#/inicio" style="display: flex; align-items: center;">
        <img src="/assets/avion.png" alt="Logo" style="max-height: 44px; margin-right: 12px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));" />
        <strong class="is-size-3" style="letter-spacing: -1px; color: var(--primary-blue);">TouristChain</strong>
      </a>
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>
    <div id="navbarBasicExample" class="navbar-menu">
      <div class="navbar-end pr-5">
        <a class="navbar-item" href="#/inicio">Inicio</a>
        <a class="navbar-item" href="#/catalogo">Catálogo</a>
        <div id="nav-login" style="display: flex;">
          <a class="navbar-item" href="#/login">Iniciar Sesión</a>
          <a class="navbar-item" href="#/registro">Registrarse</a>
        </div>
        <div id="nav-dashboard" class="is-hidden" style="display: flex;">
          <a class="navbar-item" href="#/dashboard">Mi Panel</a>
          <a class="navbar-item" id="nav-logout-btn" style="cursor: pointer; color: var(--primary-blue); font-weight: bold;">Salir</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenedor de vistas -->
  <main id="app">
    <!-- Las vistas se inyectan dinámicamente aquí via /js/router.js -->
  </main>

  <!-- Scripts -->
</body>
</html>
