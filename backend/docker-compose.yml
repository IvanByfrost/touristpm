services:
  db:
    image: mysql:8.0
    container_name: tourist-db
    restart: always
    environment:
      MYSQL_DATABASE: touristdb
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: touristuser
      MYSQL_PASSWORD: touristpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
